---
# La valeur sensible vit dans group_vars/prod/vault.yml, chiffré avec Ansible
# Vault. Ce fichier doit y définir :
#   vault_judilibre_search_elastic_node
#
# L'URL porte le compte judilibre-search, en lecture seule sur judilibre_0 et
# transaction_0. L'application n'écrit dans aucun des deux : lui donner un
# compte d'administration serait un droit accordé sans usage.
judilibre_search_elastic_node: "{{ vault_judilibre_search_elastic_node }}"

# Le dimensionnement vient des défauts du rôle
# (ansible/roles/judilibre_search/defaults/). Le redéfinir ici si la production
# interne doit être dimensionnée différemment, par exemple :
#   judilibre_search_replicas: 2
#   judilibre_search_memory_limit: 1Gi
