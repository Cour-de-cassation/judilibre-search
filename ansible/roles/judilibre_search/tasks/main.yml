---
# Les trois premiers objets ne sont créés que là où le rôle est la source de
# vérité. Sur la plateforme publique ils préexistent : cf. les drapeaux
# judilibre_search_manage_* dans les défauts du rôle.
- name: Deploy namespace
  ansible.builtin.import_tasks: create_namespace.yml
  when: judilibre_search_manage_namespace | bool

- name: Deploy configmap
  ansible.builtin.import_tasks: create_configmap.yml
  when: judilibre_search_manage_config | bool

- name: Deploy secret
  ansible.builtin.import_tasks: create_secret.yml
  when: judilibre_search_manage_config | bool

- name: Deploy deployment
  ansible.builtin.import_tasks: create_deployment.yml

- name: Deploy service
  ansible.builtin.import_tasks: create_service.yml
  when: judilibre_search_manage_service | bool
