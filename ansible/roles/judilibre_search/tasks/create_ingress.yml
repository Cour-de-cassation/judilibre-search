---
# La whitelist vient de judilibre-ops (scripts/whitelist-<app>.sh), privé :
# ce dépôt étant public, aucune adresse IP n'y figure. deploy-scaleway.sh la
# récupère et la passe en extra-var. Les journaux GitHub Actions étant publics
# eux aussi, aucune tâche n'affiche son contenu.
- name: Whitelist de l'Ingress — préparation
  ansible.builtin.set_fact:
    judilibre_search_ingress_ranges: >-
      {{ judilibre_search_ingress_whitelist.split(',')
         | map('trim') | reject('equalto', '') | unique | list }}
  no_log: true

# Une whitelist vide n'est pas « personne » mais « tout le monde » pour nginx :
# l'annotation est ignorée. Le déploiement s'arrête donc plutôt que d'ouvrir
# l'accès ou d'appliquer une entrée que nginx refuserait.
# Chaque entrée doit être une IPv4 (octets 0-255, sans zéro en tête), avec un
# masque facultatif de /8 à /32 : un masque plus large (0.0.0.0/00, /1…)
# ouvrirait l'accès à une grande partie d'Internet, et une valeur hors bornes
# serait acceptée par l'API puis rejetée par nginx (503 pour tout le monde).
- name: Whitelist de l'Ingress — contrôle
  vars:
    judilibre_search_ingress_octet: '(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])'
    judilibre_search_ingress_range_regex: >-
      ^({{ judilibre_search_ingress_octet }}[.]){3}{{ judilibre_search_ingress_octet }}(/(3[0-2]|[12][0-9]|[89]))?$
    judilibre_search_ingress_invalid: >-
      {{ judilibre_search_ingress_ranges
         | reject('match', judilibre_search_ingress_range_regex) | list | length }}
  ansible.builtin.assert:
    that:
      - judilibre_search_ingress_ranges | length > 0
      - "'0.0.0.0/0' not in judilibre_search_ingress_ranges"
      - judilibre_search_ingress_invalid | int == 0
    fail_msg: >-
      Whitelist refusée : vide, contenant 0.0.0.0/0, ou avec
      {{ judilibre_search_ingress_invalid }} entrée(s) qui ne sont ni une IPv4
      ni un CIDR de /8 à /32.
    success_msg: "{{ judilibre_search_ingress_ranges | length }} entrées dans la whitelist."

- name: Création de l'Ingress {{ judilibre_search_ingress_name }}
  kubernetes.core.k8s:
    apply: true
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
    definition: "{{ lookup('ansible.builtin.template', 'ingress.yaml.j2') | from_yaml }}"
  # L'objet rendu contient la whitelist : rien ne doit en sortir dans les logs.
  no_log: true

# Relais ACME vers l'autre cluster (cf. judilibre_search_ingress_acme_relay).
# Ni IP ni secret : seulement des noms d'hôtes déjà publics.
- name: Relais ACME — objets en place
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    namespace: "{{ judilibre_search_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
  register: judilibre_search_acme_relay_existing
  # La liste comprend l'Ingress principal et donc sa whitelist.
  no_log: true

- name: Relais ACME — création
  kubernetes.core.k8s:
    apply: true
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
    definition: "{{ lookup('ansible.builtin.template', 'acme-relay.yaml.j2') | from_yaml_all | select | list }}"
  when: judilibre_search_ingress_acme_relay | length > 0

# Un relais retiré de la configuration (ou dont la liste a raccourci) est
# supprimé, Service compris : la liste reste la seule source de vérité.
- name: Relais ACME — suppression des relais retirés
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.1.0 }}"
    kind: "{{ item.1.1 }}"
    name: "{{ item.0 }}"
    namespace: "{{ judilibre_search_namespace }}"
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
  loop: "{{ judilibre_search_acme_relay_obsolete | product([['networking.k8s.io/v1', 'Ingress'], ['v1', 'Service']]) | list }}"
  vars:
    judilibre_search_acme_relay_wanted: >-
      {{ range(1, judilibre_search_ingress_acme_relay | length + 1) | map('string')
         | map('regex_replace', '^', judilibre_search_ingress_acme_relay_name ~ '-') | list }}
    judilibre_search_acme_relay_obsolete: >-
      {{ judilibre_search_acme_relay_existing.resources | map(attribute='metadata.name')
         | select('match', '^' ~ judilibre_search_ingress_acme_relay_name ~ '-[0-9]+$')
         | reject('in', judilibre_search_acme_relay_wanted) | list }}
