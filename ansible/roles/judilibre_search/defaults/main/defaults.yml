---
# Valeurs de repli du rôle. Un environnement ne redéfinit que ce qui lui est
# propre (cf. group_vars/<environnement>/main.yml) : tout le reste vient d'ici.
#
# ⚠️ Les valeurs numériques doivent rester des entiers YAML, écrits sans
# guillemets, et être référencées telles quelles dans les manifestes — sans
# `| int`. Mesuré sur ce rôle : une référence de variable nue conserve son type
# quelle que soit la version d'ansible-core, alors qu'un filtre rend une chaîne
# jusqu'à la 2.18 incluse. L'API Kubernetes refuse un `spec.replicas` ou un
# `port` reçu en chaîne, avec une erreur qui ne parle ni d'Ansible ni de
# version. Le rôle est ainsi insensible à la version de l'outil, ce qui vaut
# mieux que de dépendre d'un pin.

# ── Identité ──────────────────────────────────────────────────────────────────
judilibre_search_namespace: judilibre
judilibre_search_app_id: judilibre-search
judilibre_search_app_port: 8000

# ── Index Elasticsearch ───────────────────────────────────────────────────────
# L'application ne fait que lire ces deux index : aucune écriture dans src/.
judilibre_search_elastic_index: judilibre_0
judilibre_search_transaction_index: transaction_0

# ── Dimensionnement ───────────────────────────────────────────────────────────
judilibre_search_replicas: 1
judilibre_search_cpu_request: 200m
judilibre_search_cpu_limit: 500m
judilibre_search_memory_request: 256Mi
judilibre_search_memory_limit: 512Mi

# Aucun NODE_OPTIONS ici, contrairement à judilibre-admin : avec une limite à
# 512 Mi, fixer le plafond du tas V8 à ~75 % de la limite le porterait au-delà
# de ce que Node choisit seul, et la mémoire hors tas ferait dépasser la limite.
# Le couple (limite mémoire, plafond de tas) est à reprendre ensemble si un jour
# la limite monte.

# ── Déploiement ───────────────────────────────────────────────────────────────
# L'image du Dockerfile déclare `USER node`. Kubernetes ne sait pas vérifier
# qu'un utilisateur désigné par son nom est non-root : sans UID numérique
# explicite, `runAsNonRoot: true` fait échouer le démarrage du pod.
judilibre_search_run_as_user: 1000
judilibre_search_run_as_group: 1000

# Délai maximum accordé au Deployment pour devenir disponible.
judilibre_search_wait_timeout: 180

# ── Périmètre du rôle ─────────────────────────────────────────────────────────
# Quels objets le rôle crée. Tout, par défaut ; un environnement dont certains
# objets sont posés ailleurs les désactive plutôt que de les réécrire.
judilibre_search_manage_namespace: true
judilibre_search_manage_config: true
judilibre_search_manage_service: true

# L'Ingress n'est géré que là où il est nginx (plateforme publique) : en privé,
# l'exposition passe par Traefik et n'est pas du ressort de ce rôle.
judilibre_search_manage_ingress: false

# ── Ingress ──────────────────────────────────────────────────────────────────────────────
# Utilisé seulement si judilibre_search_manage_ingress est vrai.
judilibre_search_ingress_name: "{{ judilibre_search_app_id }}-route"
judilibre_search_ingress_body_size: 50m
judilibre_search_ingress_forbidden_redirect: https://www.courdecassation.fr

# Liste de {host, tls_secret}. Le premier est l'hôte principal.
judilibre_search_ingress_hosts: []

# Whitelist IP, séparée par des virgules, fournie en extra-var par l'appelant.
# Vide par défaut : le rôle refuse alors de créer l'Ingress.
judilibre_search_ingress_whitelist: ""

# Accès à Elasticsearch (utilisateur, rôle, URL de connexion), géré par le rôle
# là où il en est la source de vérité (plateforme publique). En privé, l'URL
# passe par judilibre_search_secrets.
judilibre_search_manage_es_access: false

# ── Accès Elasticsearch ───────────────────────────────────────────────────────
# Utilisé seulement si judilibre_search_manage_es_access est vrai. Le mot de
# passe (judilibre_search_es_password) vient du vault du cluster, sans valeur
# de repli.
judilibre_search_es_cluster_name: judilibre
judilibre_search_es_host: "{{ judilibre_search_es_cluster_name }}-es-http"
judilibre_search_es_username: judilibre_search
judilibre_search_es_role_name: judilibre_search
judilibre_search_es_user_secret: "{{ judilibre_search_app_id }}-es-user"
judilibre_search_es_role_secret: "{{ judilibre_search_app_id }}-es-role"
judilibre_search_es_auth_secret: "{{ judilibre_search_app_id }}-es-path-with-auth"

# Essais espacés de 10 s avant de renoncer à basculer l'URL de connexion.
judilibre_search_es_auth_retries: 30

# Lecture seule : search ne fait que chercher et lire (search, get, count,
# search_after, agrégations, PIT sur les transactions).
judilibre_search_es_role_definition:
  cluster:
    - monitor
  indices:
    - names:
        - "{{ judilibre_search_elastic_index | regex_replace('_[0-9]+$', '') }}_*"
        - "{{ judilibre_search_transaction_index }}"
      privileges:
        - read

# ── Injection de configuration ────────────────────────────────────────────────
# Par défaut, un ConfigMap et un Secret injectés en bloc par envFrom. Là où les
# valeurs viennent de Secrets préexistants, extra_env les référence clé par clé,
# et extra_volumes monte ce qu'il faut. Une liste vide est un no-op valide côté
# API, ce qui évite tout rendu conditionnel dans le manifeste.
judilibre_search_extra_env: []
judilibre_search_extra_volumes: []
judilibre_search_extra_volume_mounts: []

# Laissé à false tant que ce n'est pas vérifié sur un environnement : l'activer
# sans essai casserait toute écriture temporaire de l'application.
judilibre_search_read_only_root_fs: false

# Construits ici plutôt que dans le manifeste : une expression unique se lit
# mieux qu'un bloc `when` au milieu d'une définition Kubernetes.
judilibre_search_env_from: >-
  {{ [{'configMapRef': {'name': judilibre_search_app_id ~ '-config'}},
      {'secretRef': {'name': judilibre_search_app_id ~ '-secret'}}]
     if judilibre_search_manage_config else [] }}

# Les empreintes ne valent que si le rôle gère lui-même le ConfigMap et le
# Secret ; ailleurs, elles porteraient sur des variables inexistantes.
# Celle de l'accès Elasticsearch redémarre l'application quand le mot de passe
# change : sans elle, le pod garderait l'ancienne URL.
judilibre_search_pod_annotations: >-
  {{ ({'checksum/config': judilibre_search_config | to_json(sort_keys=true) | hash('sha1'),
       'checksum/secret': judilibre_search_secrets | to_json(sort_keys=true) | hash('sha1')}
      if judilibre_search_manage_config else {})
     | combine({'checksum/es-access': [judilibre_search_es_username, judilibre_search_es_password]
                                      | to_json | hash('sha1')}
               if judilibre_search_manage_es_access else {}) }}

# Regroupées en une variable : un environnement peut n'en déclarer aucune, un
# dict vide se rendant en `resources: {}` que l'API accepte sans rien appliquer.
judilibre_search_resources:
  requests:
    memory: "{{ judilibre_search_memory_request }}"
    cpu: "{{ judilibre_search_cpu_request }}"
  limits:
    memory: "{{ judilibre_search_memory_limit }}"
    cpu: "{{ judilibre_search_cpu_limit }}"

# ── Service ───────────────────────────────────────────────────────────────────
# Nom et port variables : un environnement peut exposer un Service déjà nommé
# autrement, visé par un Ingress qui le désigne ainsi. Les appelants internes
# attendent judilibre-search-service.judilibre.svc.cluster.local:8000.
judilibre_search_service_name: "{{ judilibre_search_app_id }}-service"

# Écrit en clair plutôt que renvoyé sur judilibre_search_app_port, et ce n'est
# pas une redite : une référence de variable ne conserve son type que sur un
# seul niveau. Enchaînée — le manifeste vers cette variable, puis cette variable
# vers le port du conteneur — elle retombe en chaîne jusqu'à ansible-core 2.18,
# et l'API refuse le Service. Mesuré.
judilibre_search_service_port: 8000

# ── Contenu injecté dans le conteneur ─────────────────────────────────────────
# Configuration non sensible : ConfigMap. Les valeurs d'un ConfigMap doivent
# être des chaînes côté API Kubernetes, d'où le `| string`.
judilibre_search_config:
  APP_ID: "{{ judilibre_search_app_id }}"
  API_PORT: "{{ judilibre_search_app_port | string }}"
  ELASTIC_INDEX: "{{ judilibre_search_elastic_index }}"
  TRANSACTION_INDEX: "{{ judilibre_search_transaction_index }}"

# Secrets : Secret. Défini par environnement, sans valeur de repli — un
# environnement qui l'oublie doit échouer, pas hériter d'un mot de passe.
#
# Une seule entrée, contrairement à judilibre-admin : l'application ne lit
# aucun HTTP_PASSWD. Les seules variables consommées par src/ sont API_PORT,
# API_VERBOSITY, APP_HOST_ALTER, APP_ID, ELASTIC_INDEX, ELASTIC_NODE,
# TRANSACTION_INDEX et WITHOUT_ELASTIC.
judilibre_search_secrets:
  ELASTIC_NODE: "{{ judilibre_search_elastic_node }}"
