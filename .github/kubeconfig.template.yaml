# Gabarit de kubeconfig, rempli par envsubst depuis les secrets du dépôt.
# Repris de judilibre-ops/k8s/kubeconfig.yaml, versionné ici pour que le
# déploiement ne dépende plus d'un clone de cet autre dépôt.
apiVersion: v1
kind: Config
preferences: {}
clusters:
  - name: "${KUBE_NAME}"
    cluster:
      certificate-authority-data: ${KUBE_CA}
      server: ${KUBE_URL}
users:
  - name: ${KUBE_USER}
    user:
      token: ${KUBE_TOKEN}
contexts:
  - name: admin@${KUBE_NAME}
    context:
      cluster: "${KUBE_NAME}"
      user: ${KUBE_USER}
current-context: admin@${KUBE_NAME}
