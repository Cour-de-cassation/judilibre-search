name: Déploiement sur Scaleway

# La liste des runs affiche sinon « Déploiement sur Scaleway #2 », qui ne dit ni
# où l'on a déployé ni quoi. L'enregistrement de déploiement que GitHub crée par
# ailleurs ne retient que le commit de cette chaîne, jamais l'image livrée : sans
# cette ligne, retrouver ce qui est parti sur un cluster oblige à ouvrir les runs
# un par un.
run-name: 🚀 ${{ inputs.target }} ← ${{ inputs.image || 'image du commit' }} (par @${{ github.actor }})

# Déploie judilibre-search sur les trois clusters publics, en exécutant le rôle
# Ansible de ce dépôt — le même que sur les clusters privés.
#
# Manuel : un déploiement en production ne part pas tout seul.
#
# Périmètre : namespace, Service et Deployment. Le reste des objets d'un cluster
# — Ingress, Secrets, Elasticsearch, LoadBalancer, certificats — est créé par
# judilibre-ops, via create_environment.sh.

on:
  workflow_dispatch:
    inputs:
      image:
        # Laissé vide, le workflow déploie l'image du commit sur lequel il
        # tourne, en la construisant si elle n'est pas déjà publiée.
        #
        # Renseigné, il déploie cette référence sans rien construire : c'est ce
        # qui permet de redéployer une image déjà en service pour éprouver la
        # chaîne seule, ou de revenir à une version antérieure. Une référence
        # erronée donne un ImagePullBackOff, donc un rollout en échec, les
        # anciens pods toujours en service, et un retour arrière.
        description: "Référence complète de l'image — vide pour celle du commit"
        required: false
        type: string
      target:
        description: "Cluster visé"
        required: true
        type: choice
        default: dev-par1
        options:
          - dev-par1
          - prod-par1
          - prod-par2
          - prod-les-deux

env:
  # Épinglées : une version d'ansible-core ou de la collection qui change d'une
  # exécution à l'autre est un déploiement qui casse sans qu'aucun commit n'ait
  # bougé.
  #
  # 2.20.0 est la version de l'image alpine/ansible:2.20.0 avec laquelle la
  # chaîne privée exécute ce même rôle : les deux chaînes partagent le rôle,
  # elles partagent l'outil. Le rôle, lui, ne dépend plus de cette version — ses
  # valeurs numériques sont écrites de façon à conserver leur type sur toutes
  # les versions, ce qui a été mesuré.
  ANSIBLE_VERSION: "2.20.0"
  KUBERNETES_COLLECTION_VERSION: "5.0.0"

jobs:
  dev_par1:
    name: 🚀 dev-par1
    if: inputs.target == 'dev-par1'
    runs-on: ubuntu-latest
    environment: scw-dev-par1
    # Une seule fois pour le job : le contrôle et le retour arrière visent le
    # même namespace, et deux déclarations finiraient par diverger.
    env:
      NAMESPACE: judilibre-scw-dev-par1-dev
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DOCKERHUB_USERNAME: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.JUDILIBRE_DOCKERHUB_TOKEN }}
        run: .github/scripts/resolve-image.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: .github/scripts/deploy-scaleway.sh scw_dev_par1

      # Par l'URL publique : Ingress, certificat, LoadBalancer.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: search.dev-par1.judilibre.io
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        run: .github/scripts/rollback.sh

  prod_par1:
    name: 🚀 prod-par1
    if: inputs.target == 'prod-par1' || inputs.target == 'prod-les-deux'
    runs-on: ubuntu-latest
    environment: scw-prod-par1
    env:
      NAMESPACE: judilibre-scw-prod-par1-master
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA_PROD_PAR1 }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME_PROD_PAR1 }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN_PROD_PAR1 }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL_PROD_PAR1 }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER_PROD_PAR1 }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DOCKERHUB_USERNAME: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.JUDILIBRE_DOCKERHUB_TOKEN }}
        run: .github/scripts/resolve-image.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: .github/scripts/deploy-scaleway.sh scw_prod_par1

      # Par l'URL publique : Ingress, certificat, LoadBalancer.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: search.prod-par1.judilibre.io
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        run: .github/scripts/rollback.sh

  prod_par2:
    name: 🚀 prod-par2
    # Le second site n'est touché qu'après le premier. `always()` garde le job
    # éligible quand prod_par1 est ignoré, cas d'un déploiement visant par2 seul.
    #
    # C'est par2 que search.judilibre.io désigne aujourd'hui : le site déployé en
    # second est celui qui sert le trafic public.
    needs: prod_par1
    if: >-
      always() &&
      (inputs.target == 'prod-par2' ||
       (inputs.target == 'prod-les-deux' && needs.prod_par1.result == 'success'))
    runs-on: ubuntu-latest
    environment: scw-prod-par2
    env:
      NAMESPACE: judilibre-scw-prod-par2-master
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA_PROD_PAR2 }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME_PROD_PAR2 }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN_PROD_PAR2 }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL_PROD_PAR2 }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER_PROD_PAR2 }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          DOCKERHUB_USERNAME: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.JUDILIBRE_DOCKERHUB_TOKEN }}
        run: .github/scripts/resolve-image.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: .github/scripts/deploy-scaleway.sh scw_prod_par2

      # Par l'URL publique : Ingress, certificat, LoadBalancer.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: search.prod-par2.judilibre.io
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        run: .github/scripts/rollback.sh
